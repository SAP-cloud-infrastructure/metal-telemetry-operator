---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - bmcs
  - bmcsecrets
  - servers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - servers/status
  verbs:
  - get
  - patch
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries/finalizers
  verbs:
  - update
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries/status
  verbs:
  - get
  - patch
  - update
