name: Chart

on:
  pull_request:
    paths:
      - 'dist/chart/**'
      - '.github/workflows/chart.yml'

jobs:
  lint-and-render:
    name: Lint and render chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint (defaults)
        run: helm lint ./dist/chart
      - name: Render (defaults)
        run: helm template metal-telemetry-operator ./dist/chart
