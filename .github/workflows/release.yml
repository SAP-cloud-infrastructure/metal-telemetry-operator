name: Release

env:
  platforms: linux/amd64,linux/arm64

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  release:
    types:
      - published

jobs:
  test:
    name: Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Run vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Running Tests
        run: |
          go mod tidy
          make test

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test-e2e:
    name: E2E Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Verify kind installation
        run: kind version
      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

  test-chart:
    name: Test Chart
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Verify kind installation
        run: kind version
      - name: Create kind cluster
        run: kind create cluster
      - name: Prepare metal-telemetry-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG
      - name: Install Helm
        run: make install-helm
      - name: Lint Helm Chart
        run: helm lint ./dist/chart
      - name: Install metal-operator CRDs
        run: |
          MODULE_DIR=$(go list -m -json github.com/ironcore-dev/metal-operator | jq -r '.Dir')
          kubectl apply -k "${MODULE_DIR}/config/crd"
      - name: Deploy manager via Helm
        run: make helm-deploy
      - name: Check Helm release status
        run: make helm-status

  publish-docker:
    name: Build and publish Docker image
    needs: [test, lint, test-e2e, test-chart]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Collect metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.value }}/metal-telemetry-operator
          tags: |
            type=semver,pattern={{version}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: ${{ env.platforms }}
      - name: Set up Docker Buildx context
        run: docker context create builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        timeout-minutes: 5
        with:
          version: latest
          endpoint: builders
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          platforms: ${{ env.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            source_repository=${{ github.server_url }}/${{ github.repository }}
          push: true

  publish-chart:
    name: Release Helm Chart
    needs: [publish-docker]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Determine chart version
        id: chart_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
            VERSION="${LATEST_TAG#v}"
            BASE_VERSION="${VERSION%%-*}"
            BASE_VERSION="${BASE_VERSION%%+*}"
            MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
            MINOR=$(echo $BASE_VERSION | cut -d. -f2)
            PATCH=$(echo $BASE_VERSION | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            CHART_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-${TIMESTAMP}-${SHORT_SHA}"
          fi
          echo "version=$CHART_VERSION" >> $GITHUB_OUTPUT
      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          chmod +x /usr/local/bin/kustomize
      - name: Install yq
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && chmod a+x /usr/local/bin/yq
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set container image repository and tag
        run: |
          IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
          yq -i '.manager.image.repository = "ghcr.io/${{ env.OWNER_LC }}/metal-telemetry-operator"' dist/chart/values.yaml
          yq -i '.manager.image.tag = "'$IMAGE_TAG'"' dist/chart/values.yaml
      - name: Package Helm chart with crds folder in template
        run: |
          helm package dist/chart --version ${{ steps.chart_version.outputs.version }}-crds
      - name: Prepare CRDs folder
        run: |
          mkdir -p dist/chart/crds
          kustomize build config/default | yq ea 'select(.kind == "CustomResourceDefinition")' > dist/chart/crds/crds.yaml
          rm -rf dist/chart/templates/crd
      - name: Package Helm chart with removed crds folder from template folder
        run: |
          helm package dist/chart --version ${{ steps.chart_version.outputs.version }}
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Helm chart to GHCR
        run: |
          helm push metal-telemetry-operator-${{ steps.chart_version.outputs.version }}.tgz oci://ghcr.io/${{ env.OWNER_LC }}/charts
          helm push metal-telemetry-operator-${{ steps.chart_version.outputs.version }}-crds.tgz oci://ghcr.io/${{ env.OWNER_LC }}/charts
