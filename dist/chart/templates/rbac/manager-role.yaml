apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "metal-telemetry-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - metal.ironcore.dev
  resources:
  - bmcs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - bmcsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries/finalizers
  verbs:
  - update
- apiGroups:
  - telemetry.metal.ironcore.dev
  resources:
  - bmctelemetries/status
  verbs:
  - get
  - patch
  - update
