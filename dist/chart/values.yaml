## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect
    - --push-events-addr={{ .Values.push.eventsAddr }}
    - --push-receiver-url={{ .Values.push.receiverURL }}
    - --push-subscriber-id={{ .Values.push.subscriberID }}
    - --bmc-config-name={{ .Values.push.bmcConfigName }}
    - --bmc-config-namespace={{ .Values.push.bmcConfigNamespace }}
    - --push-events-shared-secret-name={{ .Values.push.sharedSecretName }}

  ## Environment variables for the manager container
  ##
  env: []

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Prometheus recording and alerting rules for cross-vendor Redfish metric normalization.
## When enabled, deploys PrometheusRule CRs from dist/chart/rules/*.rules into the
## operator namespace. The prometheus label must match the ruleSelector on the target
## Prometheus instance.
##
prometheusRules:
  enabled: false

  ## Deploy canonical recording rules (redfish-canonical.rules).
  recording:
    enabled: true

  ## Alerting rules. The global enabled flag is the primary on/off switch;
  ## individual alerts can be disabled independently via their own enabled flag.
  ## Each key (camelCase) maps to a rules/alert-<key>.rules file.
  alerts:
    enabled: false
    redfishUnmappedMetricId:
      enabled: true
    redfishHardwareAlert:
      enabled: true

  ## Labels applied to all generated PrometheusRule CRs.
  ## The prometheus label must match the ruleSelector on the target Prometheus instance.
  # labels:
  #   prometheus: my-prometheus-instance

  ## Additional labels to apply to all PrometheusRule CRs.
  # extraLabels: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

## Extra Kubernetes objects to deploy alongside the chart.
## Each entry is rendered as a full YAML manifest; supports Helm templating.
##
extraObjects: []

## Push MetricReport pipeline configuration.
## Enables the push receiver and subscription reconciler for HPE iLO MetricReport support.
## Push is activated when receiverURL is non-empty.
##
push:
  ## Base URL that BMCs POST MetricReports to (e.g. "http://10.0.0.5:9093").
  ## When set, enables the push receiver and subscription reconciler.
  ##
  receiverURL: ""

  ## HTTP listen address for the push receiver.
  ##
  eventsAddr: ":9093"

  ## Subscriber ID used to scope EventDestination paths.
  ## Should be unique per operator deployment.
  ##
  subscriberID: ""

  ## Name of the ConfigMap holding BMC telemetry overrides and test alert config.
  ##
  bmcConfigName: ""

  ## Namespace of the BMC config ConfigMap.
  ##
  bmcConfigNamespace: ""

  ## Name of a Kubernetes Secret holding a 32-byte shared key used to
  ## authenticate incoming Redfish event POSTs. The operator creates the Secret
  ## automatically on first start if it does not exist. When set, BMCs must
  ## include "Authorization: Bearer <hex(key)>" in every event POST; the same
  ## token is added to Redfish subscription HttpHeaders automatically.
  ## Requires push.bmcConfigNamespace to be set (the Secret is created there).
  ## When empty, the receiver accepts unauthenticated POSTs.
  ##
  sharedSecretName: ""

  ## Ingress configuration for the push receiver.
  ## Required when receiverURL points to a cluster-internal ingress.
  ##
  ingress:
    ## Ingress domain (supports Helm tpl expressions, e.g. "mto.{{ .Values.global.domain }}").
    ##
    domain: ""

    ## Enable TLS for the ingress.
    ##
    tls: true

    ## Additional annotations for the Ingress resource.
    ## Example: cert-manager annotations for automatic DNS + TLS.
    ##
    annotations: {}

## kube-state-metrics CustomResourceState integration.
## When enabled, deploys a ConfigMap holding a CustomResourceStateMetrics spec
## (in templates/extras/kube-state-metrics-crs.yaml) covering all ironcore.dev
## API sub-groups. This is the authoritative KSM config for the ironcore fleet —
## it was previously shipped by metal-maintenance-operator.
##
## IMPORTANT: this ConfigMap does nothing on its own. Upstream kube-state-metrics
## has NO label-based ConfigMap discovery — it reads a single CRS file via
## --custom-resource-state-config-file, once, at startup. A sidecar/initContainer
## must copy the label-matched ConfigMap(s) into that file. Open-source options:
## kiwigrid/k8s-sidecar (single ConfigMap) or the Greenhouse kube-monitoring
## plugin. The private cobaltcore-dev/ksm-crs-sidecar additionally merges/validates
## multiple ConfigMaps. See docs/concepts/kube-state-metrics.md for the wiring.
## Set enabled: true when running without Greenhouse.
##
kubeStateMetrics:
  enabled: false

  ## Labels applied to the ConfigMap. The consuming KSM sidecar/initContainer is
  ## configured to discover ConfigMaps carrying the label below (see the concept
  ## doc); keep it unless you mount the config another way.
  labels:
    dev.custom.kube-state-metrics: "true"

  ## Extra CustomResourceState resource entries appended to the built-in
  ## ironcore.dev set. Use this to scrape additional third-party CRD groups
  ## without editing the template — each entry is a standard kube-state-metrics
  ## CustomResourceState resource.
  extraResources: []

  ## Sidecar-discovery mode: creates a labeled ConfigMap with CustomResourceState
  ## specs for the ksm-crs-sidecar (cobaltcore-dev/ksm-crs-sidecar) or compatible
  ## k8s-sidecar to discover and merge into a pre-existing KSM instance's config.
  ##
  ## Independent of `enabled` above — use this when Greenhouse (or another
  ## platform) already runs KSM and discovers operator ConfigMaps by label.
  ## The label/labelValue must match the sidecar's LABEL / LABEL_VALUE env vars.
  ##
  ## `groups` lists the API groups for which generic kube_ironcore_info entries
  ## are emitted. All ironcore.dev sub-groups are included by default.
  sidecarDiscovery:
    enabled: false
    labels:
      dev.custom.kube-state-metrics: "true"
    groups:
      - metal.ironcore.dev
      - baseboard.metal.ironcore.dev
      - config.metal.ironcore.dev
      - maintenance.metal.ironcore.dev
      - readiness.metal.ironcore.dev
      - system.metal.ironcore.dev
      - vendorconsole.metal.ironcore.dev
      - boot.ironcore.dev
