## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect
    - --push-events-addr={{ .Values.push.eventsAddr }}
    - --push-receiver-url={{ .Values.push.receiverURL }}
    - --push-subscriber-id={{ .Values.push.subscriberID }}
    - --push-config-name={{ .Values.push.configName }}
    - --push-config-namespace={{ .Values.push.configNamespace }}
    - --push-events-shared-secret-name={{ .Values.push.sharedSecretName }}

  ## Environment variables for the manager container
  ##
  env: []

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

## Extra Kubernetes objects to deploy alongside the chart.
## Each entry is rendered as a full YAML manifest; supports Helm templating.
##
extraObjects: []

## Push MetricReport pipeline configuration.
## Enables the push receiver and subscription reconciler for HPE iLO MetricReport support.
## Push is activated when receiverURL is non-empty.
##
push:
  ## Base URL that BMCs POST MetricReports to (e.g. "http://10.0.0.5:9093").
  ## When set, enables the push receiver and subscription reconciler.
  ##
  receiverURL: ""

  ## HTTP listen address for the push receiver.
  ##
  eventsAddr: ":9093"

  ## Subscriber ID used to scope EventDestination paths.
  ## Should be unique per operator deployment.
  ##
  subscriberID: ""

  ## Name of the ConfigMap holding push mode overrides and exclusion rules.
  ##
  configName: ""

  ## Namespace of the push config ConfigMap.
  ##
  configNamespace: ""

  ## Name of a Kubernetes Secret holding a 32-byte shared key used to
  ## authenticate incoming Redfish event POSTs. The operator creates the Secret
  ## automatically on first start if it does not exist. When set, BMCs must
  ## include "Authorization: Bearer <hex(key)>" in every event POST; the same
  ## token is added to Redfish subscription HttpHeaders automatically.
  ## Requires push.configNamespace to be set (the Secret is created there).
  ## When empty, the receiver accepts unauthenticated POSTs.
  ##
  sharedSecretName: ""

  ## Ingress configuration for the push receiver.
  ## Required when receiverURL points to a cluster-internal ingress.
  ##
  ingress:
    ## Ingress domain (supports Helm tpl expressions, e.g. "mto.{{ .Values.global.domain }}").
    ##
    domain: ""

    ## Enable TLS for the ingress.
    ##
    tls: true

    ## Additional annotations for the Ingress resource.
    ## Example: cert-manager annotations for automatic DNS + TLS.
    ##
    annotations: {}
