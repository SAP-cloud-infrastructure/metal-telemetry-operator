              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BMCTelemetrySpec defines the desired state of BMCTelemetry.
            properties:
              modeOverride:
                description: |-
                  modeOverride forces the telemetry mode for this BMC, bypassing auto-detection
                  and ConfigMap rules. When unset, the mode is resolved from the ConfigMap rules
                  and the EventService probe.
                enum:
                - SSE
                - MetricReport
                - Unsupported
                - Excluded
                type: string
              streamKind:
                description: streamKind identifies which of the two monitored streams
                  this resource represents.
                enum:
                - Metrics
                - Alerts
                type: string
            type: object
          status:
            description: BMCTelemetryStatus defines the observed state of BMCTelemetry.
            properties:
              conditions:
                description: conditions represent the current state of the BMCTelemetry
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionState:
                description: connectionState reflects the current SSE connection health.
                enum:
                - Connected
                - Reconnecting
                - Failed
                - SubscriptionActive
                - SlotsFull
                type: string
              filterSyntax:
                description: filterSyntax is the SSE filter syntax variant detected
                  for this BMC vendor.
                enum:
                - Quoted
                - Unquoted
                type: string
              lastEventTime:
                description: lastEventTime is the timestamp of the most recently received
                  MetricReport event.
                format: date-time
                type: string
              mode:
                description: mode describes how telemetry is collected from this BMC.
                enum:
                - SSE
                - MetricReport
                - Unsupported
                - Excluded
                type: string
              reconnectCount:
                description: reconnectCount is the number of times the SSE connection
                  has been re-established.
                format: int64
                type: integer
              sseURI:
                description: sseURI is the detected ServerSentEventUri from the BMC
                  EventService.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
